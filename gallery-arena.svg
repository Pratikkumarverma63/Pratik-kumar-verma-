  <text x="40" y="75" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">60KG HEAVYWEIGHT COMBAT RIG IMPACT TEST</text>
  <text x="680" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffffff">[LIVE CAM 01]</text>
