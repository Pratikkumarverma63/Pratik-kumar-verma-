  <ellipse cx="400" cy="280" rx="180" ry="70" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <!-- Combat Sparks / Flash -->
  <polygon points="400,240 410,265 435,260 415,275 425,300 400,285 375,300 385,275 365,260 390,265" fill="#ffffff"/>
