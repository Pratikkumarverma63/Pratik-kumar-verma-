<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="arena-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#09090b"/>
  <rect width="800" height="500" fill="url(#arena-glow)"/>
  <!-- Arena Cage Wireframe -->
  <line x1="100" y1="100" x2="700" y2="100" stroke="#3f3f46" stroke-width="2"/>
  <line x1="50" y1="400" x2="750" y2="400" stroke="#71717a" stroke-width="3"/>
  <line x1="100" y1="100" x2="50" y2="400" stroke="#3f3f46" stroke-width="2"/>
  <line x1="700" y1="100" x2="750" y2="400" stroke="#3f3f46" stroke-width="2"/>
