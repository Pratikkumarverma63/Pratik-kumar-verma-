<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="chromeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="250" fill="url(#bgG)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 50 H400 M0 100 H400 M0 150 H400 M0 200 H400 M50 0 V250 M100 0 V250 M150 0 V250 M200 0 V250 M250 0 V250 M300 0 V250 M350 0 V250" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
  
  <!-- Quadruped Body (Matte Obsidian & Titanium) -->
  <polygon points="120,95 270,95 295,135 110,135" fill="#222222" stroke="#ffffff" stroke-width="2"/>
  
  <!-- 3D LiDAR Dome -->
  <ellipse cx="160" cy="80" rx="20" ry="12" fill="#ffffff" opacity="0.9"/>
  <rect x="150" y="80" width="20" height="15" fill="#141414" stroke="#a0a0a0" stroke-width="1.5"/>
  <line x1="160" y1="70" x2="160" y2="55" stroke="#ffffff" stroke-width="2"/>
  <circle cx="160" cy="55" r="3" fill="#ffffff"/>
  
  <!-- Optical Visor -->
  <polygon points="110,105 90,115 90,125 110,130" fill="#ffffff" opacity="0.9"/>
  
  <!-- Front Left Leg -->
  <polyline points="135,135 105,175 125,220" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="135" cy="135" r="6" fill="#888888"/>
  <circle cx="105" cy="175" r="5" fill="#888888"/>
  <circle cx="125" cy="220" r="4" fill="#ffffff"/>

  <!-- Front Right Leg -->
  <polyline points="160,135 140,175 165,220" fill="none" stroke="#444444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rear Left Leg -->
  <polyline points="265,135 295,175 275,220" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="265" cy="135" r="6" fill="#888888"/>
  <circle cx="295" cy="175" r="5" fill="#888888"/>
  <circle cx="275" cy="220" r="4" fill="#ffffff"/>

  <!-- Rear Right Leg -->
  <polyline points="245,135 270,175 255,220" fill="none" stroke="#444444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Circuit Accent -->
  <line x1="180" y1="115" x2="250" y2="115" stroke="url(#chromeG)" stroke-width="2.5" stroke-dasharray="10 5"/>
</svg>
