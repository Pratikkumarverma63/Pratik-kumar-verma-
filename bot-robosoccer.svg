<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <!-- Monochrome Gradients -->
    <radialGradient id="sc-ambient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="sc-body-cyl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sc-top-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="sc-inner-deck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sc-omni-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="sc-ball-grad" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <linearGradient id="sc-kicker-cone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-white" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect x="0" y="0" width="600" height="360" fill="url(#sc-ambient)"/>

  <!-- Field Tactical Grid & Target Concentric Rings -->
  <g opacity="0.3">
    <!-- Concentric radar circles -->
    <circle cx="300" cy="180" r="145" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="6,8"/>
    <circle cx="300" cy="180" r="100" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,6"/>
    <line x1="50" y1="180" x2="550" y2="180" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,6" opacity="0.35"/>
    <line x1="300" y1="20" x2="300" y2="340" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,6" opacity="0.35"/>
    
    <!-- Angled field guide lines -->
    <line x1="160" y1="70" x2="440" y2="290" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,6" opacity="0.2"/>
    <line x1="440" y1="70" x2="160" y2="290" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,6" opacity="0.2"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="298" rx="200" ry="26" fill="#000000" opacity="0.8"/>

  <!-- Kicker Laser Trajectory Guide Fan -->
  <polygon points="260,250 340,250 380,335 220,335" fill="url(#sc-kicker-cone)"/>
  <line x1="300" y1="250" x2="300" y2="335" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" filter="url(#glow-white)"/>

  <!-- Main 3D Perspective RoboCup SSL Bot -->
  <g filter="url(#shadow-deep)">
    <!-- ═══ OMNI-WHEEL ASSEMBLIES (Side & Rear Protrusions) ═══ -->
    <!-- Left Omni-Wheel Assembly -->
    <g transform="translate(155, 195) rotate(-18)">
      <rect x="-16" y="-36" width="32" height="72" rx="10" fill="#090d16" stroke="#ffffff" stroke-width="2"/>
      <!-- Individual sub-rollers on perimeter -->
      <rect x="-14" y="-30" width="28" height="12" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>
      <rect x="-14" y="-12" width="28" height="12" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="-14" y="6" width="28" height="12" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>
      <rect x="-14" y="24" width="28" height="10" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>

    <!-- Right Omni-Wheel Assembly -->
    <g transform="translate(445, 195) rotate(18)">
      <rect x="-16" y="-36" width="32" height="72" rx="10" fill="#090d16" stroke="#ffffff" stroke-width="2"/>
      <!-- Individual sub-rollers on perimeter -->
      <rect x="-14" y="-30" width="28" height="12" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>
      <rect x="-14" y="-12" width="28" height="12" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="-14" y="6" width="28" height="12" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>
      <rect x="-14" y="24" width="28" height="10" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>

    <!-- ═══ BOT MAIN CYLINDRICAL CHASSIS (3D Perspective Body) ═══ -->
    <!-- Lower Body Outer Shell Base -->
    <path d="M 180 145 
             L 180 235 
             A 120 42 0 0 0 420 235 
             L 420 145 Z" 
          fill="url(#sc-body-cyl)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Carbon Fiber Lower Rim Ring -->
    <ellipse cx="300" cy="235" rx="120" ry="40" fill="none" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Front Solenoid Kicker Recess Bay & Dribbler Opening -->
    <path d="M 230 215 
             L 245 258 
             A 60 22 0 0 0 355 258 
             L 370 215 
             A 70 24 0 0 1 230 215 Z" 
          fill="#050811" stroke="#ffffff" stroke-width="2"/>

    <!-- 250V High-Current Solenoid Plunger Plate -->
    <rect x="268" y="232" width="64" height="18" rx="4" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="274" y1="241" x2="326" y2="241" stroke="#ffffff" stroke-width="3" filter="url(#glow-white)"/>
    <circle cx="278" cy="241" r="2.5" fill="#ffffff"/>
    <circle cx="322" cy="241" r="2.5" fill="#ffffff"/>

    <!-- Active High-Speed Spinning Dribbler Roller -->
    <rect x="250" y="254" width="100" height="11" rx="5.5" fill="#e2e8f0" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-white)"/>
    <!-- Dribbler silicone texture rings -->
    <line x1="262" y1="254" x2="262" y2="265" stroke="#475569" stroke-width="1.5"/>
    <line x1="275" y1="254" x2="275" y2="265" stroke="#475569" stroke-width="1.5"/>
    <line x1="288" y1="254" x2="288" y2="265" stroke="#475569" stroke-width="1.5"/>
    <line x1="300" y1="254" x2="300" y2="265" stroke="#475569" stroke-width="1.5"/>
    <line x1="312" y1="254" x2="312" y2="265" stroke="#475569" stroke-width="1.5"/>
    <line x1="325" y1="254" x2="325" y2="265" stroke="#475569" stroke-width="1.5"/>
    <line x1="338" y1="254" x2="338" y2="265" stroke="#475569" stroke-width="1.5"/>

    <!-- Mid-Chassis Decorative Cooling Vents & Fasteners -->
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="195" y1="175" x2="225" y2="175"/>
      <line x1="195" y1="190" x2="225" y2="190"/>
      <line x1="375" y1="175" x2="405" y2="175"/>
      <line x1="375" y1="190" x2="405" y2="190"/>
    </g>

    <!-- ═══ TOP CAP & VISION RECOGNITION PATTERN DISC ═══ -->
    <!-- Top Cylindrical Outer Deck Surface -->
    <ellipse cx="300" cy="145" rx="120" ry="42" fill="url(#sc-top-cap)" stroke="#ffffff" stroke-width="3"/>
    <!-- Recessed Electronics & Optics Ring -->
    <ellipse cx="300" cy="145" rx="98" ry="34" fill="url(#sc-inner-deck)" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="300" cy="145" rx="76" ry="26" fill="#090d16" stroke="#64748b" stroke-width="1.2"/>

    <!-- SSL Vision Identification Pattern Color-Code Discs (Titanium White/Gray) -->
    <!-- Center Pattern Disc -->
    <ellipse cx="300" cy="145" rx="18" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" filter="url(#glow-white)"/>
    <ellipse cx="300" cy="145" rx="7" ry="4" fill="#020617"/>

    <!-- Front Orientation Marker (Larger / Highlighted) -->
    <ellipse cx="300" cy="162" rx="14" ry="7" fill="#cbd5e1" stroke="#ffffff" stroke-width="2"/>

    <!-- Left & Right Team Markers -->
    <ellipse cx="250" cy="142" rx="13" ry="6.5" fill="#94a3b8" stroke="#ffffff" stroke-width="1.8"/>
    <ellipse cx="350" cy="142" rx="13" ry="6.5" fill="#94a3b8" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Rear Marker -->
    <ellipse cx="300" cy="128" rx="12" ry="6" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Top Cap Screws & Fasteners -->
    <g fill="#ffffff">
      <circle cx="205" cy="145" r="2.5"/>
      <circle cx="395" cy="145" r="2.5"/>
      <circle cx="300" cy="108" r="2.5"/>
      <circle cx="300" cy="182" r="2.5"/>
    </g>

    <!-- Circuit Trace Lines across Deck -->
    <path d="M 235 145 Q 265 130 282 145 M 318 145 Q 335 160 365 145" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  </g>

  <!-- ═══ GLOWING 3D SOCCER BALL (Positioned in front of Dribbler) ═══ -->
  <g filter="url(#shadow-deep)">
    <!-- Ball Contact Ground Shadow -->
    <ellipse cx="300" cy="306" rx="26" ry="7" fill="#000000" opacity="0.7"/>

    <!-- 3D Spherical Ball Base -->
    <circle cx="300" cy="285" r="24" fill="url(#sc-ball-grad)" stroke="#ffffff" stroke-width="2.5" filter="url(#glow-white)"/>

    <!-- Futuristic Hexagonal & Pentagon Tracing Lines on Ball -->
    <polygon points="300,273 312,280 307,293 293,293 288,280" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="300" y1="273" x2="300" y2="263" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="312" y1="280" x2="322" y2="278" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="307" y1="293" x2="315" y2="303" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="293" y1="293" x2="285" y2="303" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="288" y1="280" x2="278" y2="278" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Specular Highlight Curve -->
    <ellipse cx="292" cy="275" rx="6" ry="3.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Ball Kick Force Impact Arc -->
  <g filter="url(#glow-white)">
    <path d="M 272 265 Q 300 258 328 265" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="260" y1="285" x2="242" y2="285" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="340" y1="285" x2="358" y2="285" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
</svg>