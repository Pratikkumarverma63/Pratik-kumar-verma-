<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <!-- Monochrome Gradients -->
    <radialGradient id="rb-ambient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="rb-hull-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rb-armor-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rb-track-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rb-laser-cone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#cbd5e1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rb-silver-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-white" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="0" y="0" width="600" height="360" fill="url(#rb-ambient)"/>

  <!-- Background Technical Grid & HUD Radar Rings in White/Gray -->
  <g opacity="0.3">
    <circle cx="300" cy="180" r="140" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="6,8"/>
    <circle cx="300" cy="180" r="95" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,6"/>
    <line x1="50" y1="180" x2="550" y2="180" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
    <line x1="300" y1="30" x2="300" y2="330" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="296" rx="220" ry="24" fill="#000000" opacity="0.75"/>

  <!-- Main Rover Body Group -->
  <g filter="url(#shadow-deep)">
    <!-- Continuous Tracks (Left & Right Pods) -->
    <!-- Lower Track Assembly Base -->
    <rect x="95" y="230" width="410" height="54" rx="27" fill="url(#rb-track-grad)" stroke="#64748b" stroke-width="2"/>
    
    <!-- Track Rubber Belt Ribs -->
    <g stroke="#94a3b8" stroke-width="1.5" opacity="0.6">
      <line x1="125" y1="230" x2="125" y2="284"/>
      <line x1="160" y1="230" x2="160" y2="284"/>
      <line x1="195" y1="230" x2="195" y2="284"/>
      <line x1="230" y1="230" x2="230" y2="284"/>
      <line x1="265" y1="230" x2="265" y2="284"/>
      <line x1="300" y1="230" x2="300" y2="284"/>
      <line x1="335" y1="230" x2="335" y2="284"/>
      <line x1="370" y1="230" x2="370" y2="284"/>
      <line x1="405" y1="230" x2="405" y2="284"/>
      <line x1="440" y1="230" x2="440" y2="284"/>
      <line x1="475" y1="230" x2="475" y2="284"/>
    </g>

    <!-- Wheels & Sprockets Inside Tracks -->
    <!-- Front Drive Sprocket -->
    <circle cx="130" cy="257" r="22" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="130" cy="257" r="12" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="130" cy="257" r="5" fill="#ffffff"/>

    <!-- Mid Road Wheels -->
    <circle cx="190" cy="257" r="17" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="190" cy="257" r="7" fill="#0f172a"/>
    <circle cx="245" cy="257" r="17" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="245" cy="257" r="7" fill="#0f172a"/>
    <circle cx="300" cy="257" r="17" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="300" cy="257" r="7" fill="#0f172a"/>
    <circle cx="355" cy="257" r="17" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="355" cy="257" r="7" fill="#0f172a"/>
    <circle cx="410" cy="257" r="17" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="410" cy="257" r="7" fill="#0f172a"/>

    <!-- Rear Tension Idler -->
    <circle cx="470" cy="257" r="22" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="470" cy="257" r="12" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="470" cy="257" r="5" fill="#ffffff"/>

    <!-- Sloped Titanium Armor Chassis -->
    <polygon points="140,230 180,145 420,145 460,230" fill="url(#rb-hull-grad)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Glacis Armor Plates Overlay -->
    <polygon points="158,224 192,154 408,154 442,224" fill="url(#rb-armor-plate)" stroke="#475569" stroke-width="1.5"/>

    <!-- Front Beveled Tactical Breacher Wedge -->
    <polygon points="115,250 160,195 160,265 115,268" fill="url(#rb-silver-glow)" stroke="#ffffff" stroke-width="1" filter="url(#glow-white)" opacity="0.85"/>
    <polygon points="440,195 485,250 485,268 440,265" fill="url(#rb-silver-glow)" stroke="#ffffff" stroke-width="1" filter="url(#glow-white)" opacity="0.85"/>

    <!-- Front LED Cyber Headlights -->
    <rect x="205" y="195" width="40" height="12" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#glow-white)"/>
    <rect x="355" y="195" width="40" height="12" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#glow-white)"/>
    
    <!-- Central Intake Grille -->
    <rect x="260" y="185" width="80" height="28" rx="5" fill="#090d16" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="272" y1="192" x2="328" y2="192" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="272" y1="199" x2="328" y2="199" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="272" y1="206" x2="328" y2="206" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- 360° LiDAR Dome Turret Assembly -->
    <rect x="265" y="98" width="70" height="48" rx="8" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="300" cy="98" rx="32" ry="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="300" cy="85" r="16" fill="#020617" stroke="#ffffff" stroke-width="2"/>
    <circle cx="300" cy="85" r="7" fill="#ffffff" filter="url(#glow-white)"/>

    <!-- LiDAR Laser Scanning Fan -->
    <polygon points="300,85 570,35 570,125" fill="url(#rb-laser-cone)"/>
    <line x1="300" y1="85" x2="570" y2="80" stroke="#ffffff" stroke-width="2" filter="url(#glow-white)"/>
    <line x1="300" y1="85" x2="560" y2="45" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>
    <line x1="300" y1="85" x2="560" y2="115" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>

    <!-- Dual Carbon Telemetry Antennas -->
    <line x1="225" y1="145" x2="185" y2="60" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="185" cy="60" r="4.5" fill="#ffffff" filter="url(#glow-white)"/>
    <line x1="375" y1="145" x2="415" y2="60" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="415" cy="60" r="4.5" fill="#ffffff" filter="url(#glow-white)"/>
  </g>
</svg>