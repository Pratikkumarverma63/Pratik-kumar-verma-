  </defs>
  <rect width="800" height="500" fill="#09090b"/>
  <rect width="800" height="500" fill="url(#swarm-glow)"/>
  <!-- Mesh Mesh Nodes for UAVs -->
  <!-- Drones in V-formation -->
  <circle cx="400" cy="160" r="16" fill="#18181b" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="380" y1="160" x2="420" y2="160" stroke="#fff" stroke-width="2"/>
  <line x1="400" y1="140" x2="400" y2="180" stroke="#fff" stroke-width="2"/>

  <circle cx="280" cy="230" r="14" fill="#18181b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="520" cy="230" r="14" fill="#18181b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="180" cy="310" r="12" fill="#18181b" stroke="#a1a1aa" stroke-width="2"/>
