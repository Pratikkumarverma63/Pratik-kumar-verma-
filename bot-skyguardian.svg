<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <!-- Monochrome Gradients -->
    <radialGradient id="uav-ambient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="uav-carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="uav-fuselage-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-white" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect x="0" y="0" width="600" height="360" fill="url(#uav-ambient)"/>

  <!-- Flight HUD Altitude & Crosshair Matrix in White/Gray -->
  <g opacity="0.3">
    <circle cx="300" cy="168" r="140" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,8"/>
    <circle cx="300" cy="168" r="85" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,6"/>
    <line x1="60" y1="168" x2="540" y2="168" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>
    <line x1="300" y1="20" x2="300" y2="330" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>
  </g>

  <!-- Flight Shadow -->
  <ellipse cx="300" cy="305" rx="150" ry="16" fill="#000000" opacity="0.6"/>

  <!-- Main Hexacopter Assembly in White/Gray -->
  <g filter="url(#shadow-deep)">
    <!-- 6 Carbon Fiber Booms / Motor Arms -->
    <!-- Arm 1: Top Left -->
    <line x1="265" y1="140" x2="140" y2="85" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <line x1="265" y1="140" x2="140" y2="85" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="140" cy="85" rx="55" ry="9" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,6" filter="url(#glow-white)"/>
    <circle cx="140" cy="85" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="140" cy="76" r="2.5" fill="#ffffff" filter="url(#glow-white)"/>

    <!-- Arm 2: Top Right -->
    <line x1="335" y1="140" x2="460" y2="85" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <line x1="335" y1="140" x2="460" y2="85" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="460" cy="85" rx="55" ry="9" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,6" filter="url(#glow-white)"/>
    <circle cx="460" cy="85" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="460" cy="76" r="2.5" fill="#ffffff" filter="url(#glow-white)"/>

    <!-- Arm 3: Mid Left -->
    <line x1="245" y1="168" x2="105" y2="168" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="105" cy="168" rx="55" ry="9" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,6" filter="url(#glow-white)"/>
    <circle cx="105" cy="168" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Arm 4: Mid Right -->
    <line x1="355" y1="168" x2="495" y2="168" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="495" cy="168" rx="55" ry="9" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,6" filter="url(#glow-white)"/>
    <circle cx="495" cy="168" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Arm 5: Bottom Left -->
    <line x1="265" y1="196" x2="150" y2="252" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <line x1="265" y1="196" x2="150" y2="252" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="150" cy="252" rx="55" ry="9" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,6" filter="url(#glow-white)"/>
    <circle cx="150" cy="252" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Arm 6: Bottom Right -->
    <line x1="335" y1="196" x2="450" y2="252" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <line x1="335" y1="196" x2="450" y2="252" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="450" cy="252" rx="55" ry="9" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,6" filter="url(#glow-white)"/>
    <circle cx="450" cy="252" r="8" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Central Aerodynamic Carbon Fuselage -->
    <polygon points="300,115 355,142 355,194 300,222 245,194 245,142" fill="url(#uav-carbon)" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Top Carbon Dome Canopy -->
    <polygon points="300,128 340,148 340,188 300,208 260,188 260,148" fill="url(#uav-fuselage-top)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- GPS Antenna Puck Dome -->
    <ellipse cx="300" cy="150" rx="16" ry="9" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="300" cy="148" r="4" fill="#ffffff" filter="url(#glow-white)"/>

    <!-- 3-Axis Radiometric 4K Thermal Gimbal Camera Bay -->
    <rect x="292" y="218" width="16" height="14" rx="3" fill="#1e293b" stroke="#ffffff" stroke-width="1"/>
    <circle cx="300" cy="242" r="18" fill="#0f172a" stroke="#ffffff" stroke-width="2" filter="url(#glow-white)"/>
    <circle cx="300" cy="242" r="9" fill="#475569" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="300" cy="242" r="3.5" fill="#ffffff"/>

    <!-- Thermal Targeting Crosshair Line -->
  </g>
</svg>