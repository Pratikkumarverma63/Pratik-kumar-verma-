<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="pod-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#09090b"/>
  <rect width="600" height="400" fill="url(#bg4)"/>
  <!-- Vacuum Tube Ring Guides -->
  <ellipse cx="300" cy="200" rx="260" ry="110" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="6,6"/>
  <g transform="translate(300, 200)">
    <!-- Aerodynamic Pod Body -->
    <path d="M-180,0 Q-150,-40 -60,-40 L80,-40 Q160,-35 200,0 Q160,35 80,40 L-60,40 Q-150,40 -180,0 Z" fill="url(#pod-grad)" stroke="#10b981" stroke-width="2.5"/>
    <!-- MagLev Skids -->
    <rect x="-110" y="35" width="65" height="12" rx="3" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="50" y="35" width="65" height="12" rx="3" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <!-- Cockpit Canopy & Air Intake -->
    <path d="M-20,-38 Q40,-38 80,-20 L-20,-20 Z" fill="#09090b" stroke="#10b981" stroke-width="1.5"/>
    <!-- Linear Induction Stator -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="8,4"/>
  </g>
  <text x="30" y="45" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" letter-spacing="2">HYPERLOOP MACH-1 // VACUUM MAGLEV TRANSPORT</text>
  <text x="30" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">SPEED: 1,100 KM/H // LINEAR INDUCTION MOTOR // 0.001 ATM</text>
</svg>