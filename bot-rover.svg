<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="rover-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#09090b"/>
  <rect width="600" height="400" fill="url(#bg2)"/>
  <g transform="translate(300, 200)">
    <!-- Rocker Bogie Suspension -->
    <path d="M-80,20 L-110,70 L-60,70 L0,20 L60,70 L110,70 L80,20" fill="none" stroke="#71717a" stroke-width="5"/>
    <path d="M-50,35 L0,20 L50,35" fill="none" stroke="#10b981" stroke-width="3"/>
    <!-- 6 Wheels -->
    <circle cx="-110" cy="70" r="22" fill="#18181b" stroke="#10b981" stroke-width="3"/>
    <circle cx="-60" cy="70" r="22" fill="#18181b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-10" cy="70" r="22" fill="#18181b" stroke="#71717a" stroke-width="2"/>
    <circle cx="60" cy="70" r="22" fill="#18181b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="110" cy="70" r="22" fill="#18181b" stroke="#10b981" stroke-width="3"/>
    <!-- Chassis -->
    <rect x="-85" y="-35" width="170" height="55" rx="8" fill="url(#rover-body)" stroke="#10b981" stroke-width="2"/>
    <!-- Solar Panels Deck -->
    <rect x="-75" y="-45" width="150" height="10" rx="3" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <!-- Sensor Mast & Stereo Camera -->
    <line x1="50" y1="-35" x2="50" y2="-105" stroke="#e4e4e7" stroke-width="4"/>
    <rect x="35" y="-120" width="30" height="18" rx="4" fill="#18181b" stroke="#10b981" stroke-width="2"/>
    <circle cx="43" cy="-111" r="4" fill="#10b981"/>
    <circle cx="57" cy="-111" r="4" fill="#10b981"/>
    <!-- High Gain Antenna Dish -->
    <ellipse cx="-50" cy="-65" rx="20" ry="12" fill="#27272a" stroke="#fff" stroke-width="2"/>
    <line x1="-50" y1="-35" x2="-50" y2="-65" stroke="#71717a" stroke-width="3"/>
  </g>
  <text x="30" y="45" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" letter-spacing="2">TITAN-MARS // 6WD AUTONOMOUS EXPLORATION ROVER</text>
  <text x="30" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">ROCKER-BOGIE CHASSIS // 3D LIDAR SLAM // STEREO MAST CAM</text>
</svg>