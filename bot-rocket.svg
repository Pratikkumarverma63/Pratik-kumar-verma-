<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="50%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#09090b"/>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g transform="translate(300, 200)">
    <!-- Exhaust Plume -->
    <polygon points="-20,130 0,220 20,130" fill="url(#fire)" opacity="0.8"/>
    <!-- Rocket Body -->
    <path d="M-30,130 L-30,-60 Q0,-140 30,-60 L30,130 Z" fill="url(#metal)" stroke="#10b981" stroke-width="2"/>
    <!-- Grid Fins -->
    <rect x="-45" y="-30" width="15" height="25" rx="3" fill="#18181b" stroke="#fff" stroke-width="1.5"/>
    <rect x="30" y="-30" width="15" height="25" rx="3" fill="#18181b" stroke="#fff" stroke-width="1.5"/>
    <!-- Stage Separation Ring -->
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#10b981" stroke-width="3"/>
    <!-- Engine Nozzles -->
    <polygon points="-25,130 -35,150 -15,150" fill="#27272a" stroke="#fff" stroke-width="1.5"/>
    <polygon points="-10,130 -15,155 15,155 10,130" fill="#27272a" stroke="#fff" stroke-width="1.5"/>
    <polygon points="25,130 35,150 15,150" fill="#27272a" stroke="#fff" stroke-width="1.5"/>
    <!-- Landing Legs -->
    <path d="M-30,110 L-65,160 L-55,160 L-30,125" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <path d="M30,110 L65,160 L55,160 L30,125" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <!-- Telemetry Markings -->
    <text x="-20" y="-10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981" letter-spacing="1">ARES-IX</text>
  </g>
  <text x="30" y="45" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" letter-spacing="2">ARES-IX // TWO-STAGE ORBITAL LAUNCH VEHICLE</text>
  <text x="30" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">THRUST: 1200 kN // REUSABLE FIRST STAGE // PAYLOAD: 2.5 TONS</text>
</svg>